<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>祝福の食卓</title>
<style>
  :root {
    --bg-main: #12100e;
    --bg-card: #1b1815;
    --bg-sub: #25201b;
    --text-main: #e2d8c8;
    --text-muted: #968977;
    --accent-gold: #c29b57;
    --accent-green: #587856;
    --accent-blue: #52738a;
    --accent-danger: #9e2a2b;
    --border-color: #3d342b;
    --border-highlight: #5e4f3e;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
    --vignette: inset 0 0 40px rgba(0, 0, 0, 0.6);
  }

  /* 摩耗度による画面の深淵化 */
  body.decay-1 {
    --bg-main: #100d0c;
    --bg-card: #181412;
    --vignette: inset 0 0 65px rgba(40, 5, 5, 0.65);
  }
  body.decay-2 {
    --bg-main: #0d0909;
    --bg-card: #161010;
    --border-color: #4a2828;
    --accent-gold: #a67641;
    --vignette: inset 0 0 90px rgba(75, 8, 8, 0.75);
  }
  body.decay-3 {
    --bg-main: #090505;
    --bg-card: #120b0b;
    --bg-sub: #1c1111;
    --border-color: #5c2323;
    --text-main: #d6c5c5;
    --accent-gold: #8c4a32;
    --vignette: inset 0 0 120px rgba(110, 10, 10, 0.85);
  }

  /* 第10話・真実ルート用の静謐な白銀トーン */
  body.truth-mode {
    --bg-main: #111317;
    --bg-card: #181c22;
    --bg-sub: #21262e;
    --border-color: #3c4654;
    --border-highlight: #687991;
    --accent-gold: #b8cde0;
    --vignette: inset 0 0 80px rgba(180, 205, 230, 0.14);
  }

  /* 地獄ルート（光の届かない屋敷）用の漆黒・血闇トーン */
  body.hell-mode {
    --bg-main: #050303;
    --bg-card: #0c0606;
    --bg-sub: #140909;
    --border-color: #4a1515;
    --border-highlight: #7a1c1c;
    --text-main: #cbb8b8;
    --text-muted: #7a6363;
    --accent-gold: #b33636;
    --vignette: inset 0 0 150px rgba(120, 0, 0, 0.92);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100dvh;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
    transition: background-color 1.2s ease, box-shadow 1.2s ease;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: var(--vignette);
    z-index: 900;
  }

  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: env(safe-area-inset-bottom, 16px);
    position: relative;
    z-index: 1;
  }

  header {
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    outline: 1px solid var(--border-color);
    outline-offset: -4px;
    border-radius: 4px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
    gap: 8px;
  }

  .day-badge {
    font-weight: 700;
    font-size: 1rem;
    color: var(--accent-gold);
    letter-spacing: 0.05em;
  }

  .header-btns {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  @media (max-width: 440px) {
    .stats-row {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .stat-pill {
    background: var(--bg-sub);
    border: 1px solid var(--border-color);
    padding: 3px 5px;
    border-radius: 2px;
    font-weight: 600;
    color: var(--text-muted);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-pill.active {
    border-color: var(--text-main);
    color: var(--text-main);
  }

  .stat-pill.recorded {
    border-color: var(--accent-gold);
    color: var(--accent-gold);
  }

  .stat-pill.recorded-bad {
    border-color: #9e2a2b;
    color: #e07a7a;
  }

  .stat-pill.secret-pill {
    border-style: dashed;
  }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    border: 1px solid var(--border-highlight);
    border-radius: 3px;
    padding: 10px 12px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, background-color 0.2s, border-color 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    touch-action: manipulation;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  }

  button:active:not(:disabled) {
    transform: scale(0.98);
  }

  .btn-outline {
    background: var(--bg-sub);
    color: var(--text-main);
    border-color: var(--border-color);
  }
  .btn-outline:hover:not(:disabled) {
    border-color: var(--accent-gold);
  }

  .btn-secret {
    background: linear-gradient(180deg, #2b3847, #19212b);
    color: #e3f0ff;
    border-color: #8bb4de;
    box-shadow: 0 0 14px rgba(139, 180, 222, 0.25);
  }

  .btn-hell {
    background: linear-gradient(180deg, #3d0d0d, #1f0505);
    color: #f5c6c6;
    border-color: #9e2a2b;
    box-shadow: 0 0 14px rgba(158, 42, 43, 0.35);
  }

  .child-card {
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    border-radius: 4px;
    padding: 16px;
    box-shadow: var(--shadow);
    position: relative;
  }

  .child-card::before {
    content: "";
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border: 1px solid rgba(194, 155, 87, 0.12);
    pointer-events: none;
  }

  .echo-note {
    background: rgba(12, 10, 9, 0.75);
    border-left: 2px solid var(--accent-gold);
    padding: 8px 10px;
    font-size: 0.83rem;
    margin-bottom: 14px;
    color: var(--text-muted);
    font-style: italic;
  }

  .echo-note.dark {
    border-left-color: #9e2a2b;
    color: #cfa8a8;
  }

  .stamp-box {
    margin: 14px 0;
    padding: 12px;
    border: 1px solid var(--accent-gold);
    background: rgba(194, 155, 87, 0.08);
    text-align: center;
    border-radius: 3px;
  }

  .stamp-box.bad {
    border-color: #9e2a2b;
    background: rgba(158, 42, 43, 0.15);
  }

  .stamp-box.truth {
    border-color: #8bb4de;
    background: rgba(139, 180, 222, 0.12);
  }

  .stamp-num {
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    display: block;
    margin-bottom: 3px;
  }

  .stamp-title {
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.08em;
  }

  .stamp-box.bad .stamp-title {
    color: #e06c6c;
  }

  .stamp-box.truth .stamp-title {
    color: #d6eaff;
  }

  .modal-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 2;
  }

  .modal-choices button {
    width: 100%;
    text-align: left;
    justify-content: flex-start;
    padding: 12px 14px;
    line-height: 1.45;
  }

  /* 図鑑モーダル */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 4, 3, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }

  .modal-box {
    background: var(--bg-card);
    color: var(--text-main);
    width: 100%;
    max-width: 540px;
    max-height: 86dvh;
    overflow-y: auto;
    border-radius: 4px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    border: 1px solid var(--accent-gold);
  }

  .modal-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent-gold);
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-highlight);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .archive-section {
    margin-bottom: 14px;
  }

  .archive-section h4 {
    margin: 0 0 6px 0;
    font-size: 0.86rem;
    color: var(--accent-gold);
  }

  .archive-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
    font-size: 0.78rem;
  }

  .archive-item {
    background: var(--bg-sub);
    border: 1px solid var(--border-color);
    padding: 5px 8px;
    border-radius: 2px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .archive-item.unlocked {
    border-color: var(--border-highlight);
    color: var(--text-main);
  }

  .archive-item.locked {
    color: var(--text-muted);
    opacity: 0.55;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-top">
      <div class="day-badge" id="day"></div>
      <div class="header-btns">
        <button class="btn-outline" id="btn-arc" style="padding:4px 9px;font-size:0.75rem;">記録帳</button>
        <button class="btn-outline" id="rst" style="padding:4px 9px;font-size:0.75rem;">最初から</button>
      </div>
    </div>
    <div class="stats-row" id="st"></div>
  </header>

  <div class="child-card">
    <div id="echo" class="echo-note hidden"></div>
    <div id="txt" style="white-space:pre-line;line-height:1.95;margin:4px 0 16px;font-size:0.98rem"></div>
    <div id="stamp" class="stamp-box hidden"></div>
    <div class="modal-choices" id="ch"></div>
  </div>
</div>

<!-- 記録帳モーダル -->
<div id="arc-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">
      <span>聖園の観測記録</span>
      <button class="btn-outline" id="arc-close" style="padding:3px 10px;font-size:0.78rem;">閉じる</button>
    </div>
    <div id="arc-body"></div>
  </div>
</div>

<script>
const KEY = 'seien_relay_10_v3';
const ARC_KEY = 'seien_relay_10_archive_v3';

const ROMAN = { 1: 'Ⅰ', 2: 'Ⅱ', 3: 'Ⅲ', 4: 'Ⅳ', 5: 'Ⅴ' };
const END_CAT = {
  1: 'Ⅰ：幸せな出荷',
  2: 'Ⅱ：疑念',
  3: 'Ⅲ：出荷不能',
  4: 'Ⅳ：逃亡',
  5: 'Ⅴ：殺処分'
};

// 全10エピソード定義
const EPISODES = [
  { id: 1, name: 'ユイ', no: '1番', start: 'ep1_s1' },
  { id: 2, name: 'フタバ', no: '2番', start: 'ep2_s1' },
  { id: 3, name: 'ヨナ', no: '4番', start: 'ep3_s1' },
  { id: 4, name: 'ハル', no: '5番', start: 'ep4_s1' },
  { id: 5, name: 'リク', no: '6番', start: 'ep5_s1' },
  { id: 6, name: 'ナナ', no: '7番', start: 'ep6_s1' },
  { id: 7, name: 'レン', no: '8番', start: 'ep7_s1' },
  { id: 8, name: 'ココ', no: '9番', start: 'ep8_s1' },
  { id: 9, name: 'トウカ', no: '10番', start: 'ep9_s1' },
  { id: 10, name: 'モモ', no: '100番', start: 'ep10_s1', secret: true }
];

// 大エンド定義
const GRAND_ENDS = [
  {
    id: 'G1',
    roman: '大終幕 Ⅰ',
    title: '完璧なる祝福の食卓',
    check: (r) => r.length >= 9 && r.slice(0, 9).every(x => x === 1),
    text: `九人の子供たちは、誰一人として涙を流さず、誰一人として疑うことなく、白い晴れ着で門をくぐった。

本部からは「聖園の歴史上、最も純粋で芳醇な出荷記録」として最高位の勲章が贈られた。
あなたの台帳には、汚れひとつない『Ⅰ』の文字だけが九つ並んでいる。

――その完璧な記録が呼び水となったのか、あるいは長い輪廻の果てか。
閉じたはずの門の向こうから、見たこともない番号札をつけた少女の気配が近づいていた。`
  },
  {
    id: 'G2',
    roman: '大終幕 Ⅱ',
    title: 'ひび割れた楽園',
    check: (r) => r.length >= 9 && r.slice(0, 9).every(x => x === 1 || x === 2) && r.slice(0, 9).includes(2),
    text: `九人分の出荷ノルマは、すべて達成された。
けれどあなたは知っている。あの笑顔のいくつかは、真実を知った上であなたを安心させるために作られた仮面だったことを。

子供たちは優しすぎたのだ。
愛する園長先生を「人殺し」にしないために、自ら進んで食卓へと歩いていった。

勲章の重みが、夜ごとにあなたの首を絞めていく。`
  },
  {
    id: 'G3',
    roman: '大終幕 Ⅲ',
    title: '空っぽの鳥籠',
    check: (r) => r.slice(0, 9).filter(x => x === 4).length >= 3 || r[8] === 4,
    text: `開いた裏門から吹き込む夜風が、台帳のページを乱暴にめくる。
逃げ延びた子供たちが、外の世界へ「聖園の真実」を持ち出してしまったのだ。

夜明け前、森の向こうから無数のサイレンと犬の吠え声が近づいてくる。
本部からの連絡はすでに途絶えている。

あなたは一人、誰もいない食堂の椅子に座り、扉が蹴破られる音を待った。`
  },
  {
    id: 'G4',
    roman: '大終幕 Ⅳ',
    title: '灰と血の屠殺場',
    check: (r) => r.slice(0, 9).filter(x => x === 5).length >= 3 || (r.slice(0, 9).filter(x => x === 3 || x === 5).length >= 5 && r.slice(0, 9).includes(5)),
    text: `聖園はもはや「幸福な牧場」ではなかった。
地下の焼却炉は絶えず黒煙を吐き、子供たちの悲鳴と恐怖が壁に染み付いている。

やがて届いた本部の通達は、短い一文だけだった。
『品質管理能力の著しい欠如を認める。現園長を廃棄処分とせよ』

重い足音が廊下を近づいてくる。今度は、あなたが台帳から消される番だった。`
  },
  {
    id: 'G5',
    roman: '大終幕 Ⅴ',
    title: '静かなる墓標',
    check: (r) => r.slice(0, 9).filter(x => x === 3).length >= 3,
    text: `出荷できた数は、あまりに少なかった。
真実に耐えきれず、恐怖に押し潰され、子供たちは自らの手で命の灯を消していった。

聖園には、死の静寂だけが降り積もっている。
あなたは冷めきったスープの皿を九つ並べ、誰も座らない椅子に向かって「いただきます」と呟いた。`
  },
  {
    id: 'G6',
    roman: '大終幕 Ⅵ',
    title: '歪んだ日常の継続',
    check: () => true,
    text: `天使として旅立った者。嘘を見抜いた者。闇へ消えた者。灰になった者。
九人分の台帳には、いびつな記録が刻まれた。

本部は眉をひそめながらも、あなたの続投を認めた。「多少のロスは許容範囲だ」と。

季節が巡り、門の前に新しい子供たちが立つ。
あなたは擦り切れた台帳を開き、次の名前を書き込んだ。`
  },
  {
    id: 'G7',
    roman: '大終幕 Ⅶ',
    title: '嘘偽りない真実',
    secret: true,
    check: (r) => r.length === 10,
    text: (r) => {
      const momoRes = r[9];
      const epilogueByMomo = {
        1: `モモは白い晴れ着を脱ぎ捨て、あなたの隣に並んだ。\n『もう、誰かを騙すための天国はいらないね』\n二人は聖園の重厚な正門を内側から解き放ち、朝日が昇る外の世界へと歩き出した。`,
        2: `モモはあなたの罪も、過去の「完璧な出荷」の記憶もすべて受け入れた上で、静かに微笑んだ。\n『ここから先は、本当のことだけを話そう、園長先生』\n焼却炉の火は消え、聖園は初めて人間の家になった。`,
        3: `モモは自らの命を懸けて、百代続いた「祝福のシステム」の心臓部を停止させた。\n崩れゆく聖園の瓦礫の中で、あなたは初めて偽りのない涙を流した。`,
        4: `モモはすべての台帳と記録を抱えて、夜の森へと駆け抜けた。\nやがて世界は「聖園」の真実を知り、食卓の偽善は白日の下に晒されることになる。`,
        5: `あなたは自らの手で百番目の少女を葬り、同時に聖園のすべてに火を放った。\n炎の中で灰になっていく台帳を見つめながら、あなたはようやく「園長」という呪いから解放された。`
      };
      return `百番目の少女・モモとの対話を経て、聖園を覆っていた「祝福」という名の分厚い霧は完全に晴れ渡った。\n\n食肉農園としての起源も、初代園長から受け継がれた偽りの教義も、もうあなたを縛ることはできない。\n\n${epilogueByMomo[momoRes] || ''}\n\n台帳の最後のページには、数字でも等級でもない、ただ一つの言葉が記されていた。\n――「ここに、人間がいた」。`;
    }
  },
  {
    id: 'G8',
    roman: '大終幕 Ⅷ',
    title: '光の届かない屋敷',
    secret: true,
    hell: true,
    check: () => false,
    text: `真実を語る唯一の少女・モモを、あなたは自らの手で葬り去った。
血に濡れた手首の札『100』を焼却炉へ放り込んだ瞬間、ここでの真実はもう私以外知り得ないものとなった。

それからもこの屋敷には身寄りのない子供たちが
幸せを信じてここを訪れる。新しい家族が見つかると信じて。

あなたは食堂に皿を並べ、今日も張り付けた笑みで子供たちに微笑みかける。
「いい子だね。たくさん食べて、立派な天使になるんだよ」

もうきっと、ここでのことを知ることはない。
また幸せになると嘯き、あの子たちを天使にしよう。`
  }
];

// ==========================================
// シナリオデータ（第1話〜第10話）
// ==========================================
const SC = {
  // --- 第1話：ユイ（1番） ---
  ep1_s1: {
    ep: 1,
    l: '第1話 ユイ（1番）― 最初のまなざし',
    t: `聖園で一番古い少女、ユイ。
「1」の番号を持つ彼女は、誰よりも長くこの白い屋敷で暮らし、あなたの書類仕事を黙って手伝っている。

『園長先生。今月の台帳、整理しておきました。もうすぐ私の番ですね』

窓から差し込む光の中で、ユイは静かに微笑んでいる。`,
    c: [
      ['「君は聖園の誇りだ。誰よりも立派な天使になれる」と教える', 'ep1_s2', { faith: 2, trust: 1 }],
      ['「いつも助かっているよ。君がいなければ回らない」と労う', 'ep1_s2', { trust: 2, doubt: 1 }],
      ['「余計なことは考えず、規則通り食べなさい」と冷たく告げる', 'ep1_s2', { fear: 2, doubt: 1 }]
    ]

『食べる側も、育てる側も、「あの子たちは幸せだった」と思い込まないと、正気でいられなかったから』

モモは真っ直ぐにあなたの目を見つめた。

    c: [

  // 「もう、逃げられない。」を選んだ後の5択（小エンドⅠ〜Ⅴ）

『さあ、園長先生。百番目の記録を、どう書き込む？』`,

  ep10_e1: { ep: 10, res: 1, title: '新たなる夜明けの祝福', t: `モモはあなたの言葉を聞き、初めて心からの笑顔を見せた。\n『嘘のない祝福なら、きっと本当の意味で誰かを幸せにできるね』\n二人は古い台帳を閉じ、新しい世界の扉を開いた。` },

  ep10_e5: { ep: 10, res: 5, title: '浄化の炎', t: `あなたは百番目の少女と共に、聖園のすべてを炎で焼き尽くした。\n灰の中から昇る朝日は、どこまでも澄み渡っていた。` }

// --- 状態管理 ---
let state = {
  epIdx: 0,
  node: 'ep1_s1',
  results: [],
  vars: { faith: 0, doubt: 0, fear: 0, trust: 0 },
  decay: 0,
  forcedGrand: null,
  _initedNode: false
};

let archive = {
  small: [], // '1_1' .. '10_5'
  grand: []  // 'G1' .. 'G8'
};

const $ = id => document.getElementById(id);

function loadArchive() {
  try {
    const raw = localStorage.getItem(ARC_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.small && parsed.grand) archive = parsed;
    }
  } catch (e) {}
}

function saveArchive() {
  try {
    localStorage.setItem(ARC_KEY, JSON.stringify(archive));
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.node && (SC[parsed.node] || parsed.node === 'GRAND_END')) {
        state = parsed;
        return true;
      }
    }
  } catch (e) {}
  return false;
}

function updateVisuals() {
  document.body.classList.remove('decay-1', 'decay-2', 'decay-3', 'truth-mode', 'hell-mode');

  if (state.node === 'ep10_hell' || state.forcedGrand === 'G8') {
    document.body.classList.add('hell-mode');
    return;
  }
  if (state.epIdx === 9 || state.results.length === 10) {
    document.body.classList.add('truth-mode');
    return;
  }
  const darkCount = state.results.filter(x => x === 3 || x === 5).length;
  const totalDecay = state.decay + darkCount;
  if (totalDecay >= 5) document.body.classList.add('decay-3');
  else if (totalDecay >= 3) document.body.classList.add('decay-2');
  else if (totalDecay >= 1) document.body.classList.add('decay-1');
}

function renderHeader(label) {
  $('day').textContent = label;
  const st = $('st');
  st.innerHTML = '';

  const showSecretSlot = archive.grand.includes('G1') || state.epIdx === 9 || state.results.length === 10;

  EPISODES.forEach((ep, idx) => {
    if (ep.secret && !showSecretSlot) return;

    const pill = document.createElement('span');
    pill.className = 'stat-pill';
    if (ep.secret) pill.classList.add('secret-pill');

    const res = state.results[idx];
    if (ep.id === 10 && (state.node === 'ep10_hell' || state.forcedGrand === 'G8')) {
      pill.textContent = `10.モモ:抹消`;
      pill.classList.add('recorded-bad');
    } else if (res) {
      pill.textContent = `${ep.id}.${ep.name}:${ROMAN[res]}`;
      pill.classList.add(res >= 3 ? 'recorded-bad' : 'recorded');
    } else if (idx === state.epIdx && state.node !== 'GRAND_END') {
      pill.textContent = `${ep.id}.${ep.name}:観測中`;
      pill.classList.add('active');
    } else {
      pill.textContent = `${ep.id}.${ep.name}:―`;
    }
    st.appendChild(pill);
  });
}

function go(nodeId) {
  state.node = nodeId;
  const sc = SC[nodeId];
  if (!sc) return resetGame();

  if (sc.init && !state._initedNode) {
    sc.init(state.vars, state.results);
    state._initedNode = true;
  }

  updateVisuals();
  renderHeader(sc.l || `第${sc.ep}話 結末`);

  const echoEl = $('echo');
  if (sc.echo && state.results.length > 0) {
    echoEl.textContent = sc.echo(state.results);
    echoEl.classList.remove('hidden', 'dark');
    if (state.results[state.results.length - 1] >= 3 && sc.ep < 10) echoEl.classList.add('dark');
  } else {
    echoEl.classList.add('hidden');
  }

  const bodyText = typeof sc.t === 'function' ? sc.t(state.vars) : sc.t;
  $('txt').textContent = bodyText;

  const stampEl = $('stamp');
  const chEl = $('ch');
  chEl.innerHTML = '';

  // 小エンド到達時
  if (sc.res) {
    const key = `${sc.ep}_${sc.res}`;
    if (!archive.small.includes(key)) {
      archive.small.push(key);
      saveArchive();
    }

    if (state.results.length < sc.ep) {
      state.results.push(sc.res);
    }

    const justUnlockedG1 = sc.ep === 9 && state.results.slice(0, 9).every(x => x === 1);
    if (justUnlockedG1 && !archive.grand.includes('G1')) {
      archive.grand.push('G1');
      saveArchive();
    }

    updateVisuals();
    renderHeader(`第${sc.ep}話 記録完了`);

    stampEl.classList.remove('hidden', 'bad', 'truth');
    if (sc.ep === 10) stampEl.classList.add('truth');
    else if (sc.res >= 3) stampEl.classList.add('bad');

    stampEl.innerHTML = `
      <span class="stamp-num">EPISODE ${sc.ep} RESULT ─ ${END_CAT[sc.res]}</span>
      <span class="stamp-title">小終幕 ${ROMAN[sc.res]}『${sc.title}』</span>
    `;

    // 1〜8話の次へ
    if (sc.ep < 9) {
      const nextEp = EPISODES[sc.ep];
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn-outline';
      nextBtn.textContent = `次の観測へ進む（第${nextEp.id}話：${nextEp.name}）`;
      nextBtn.onclick = () => {
        state.epIdx = sc.ep;
        state.vars = { faith: 0, doubt: 0, fear: 0, trust: 0 };
        state._initedNode = false;
        go(nextEp.start);
      };
      chEl.appendChild(nextBtn);
    }
    // 9話終了時：通常の9人結末 + 条件達成時のみモモ（100番）への扉
    else if (sc.ep === 9) {
      const canEnterMomo = archive.grand.includes('G1');
      if (canEnterMomo) {
        const secretBtn = document.createElement('button');
        secretBtn.className = 'btn-secret';
        secretBtn.textContent = justUnlockedG1
          ? '★ 大終幕Ⅰ達成！『第10話：モモ（100番）』の扉を開く'
          : '【特別観測】第10話：モモ（100番）の扉を開く';
        secretBtn.onclick = () => {
          state.epIdx = 9;
          state.vars = { faith: 0, doubt: 0, fear: 0, trust: 0 };
          state._initedNode = false;
          go('ep10_s1');
        };
        chEl.appendChild(secretBtn);
      }

      const endBtn = document.createElement('button');
      endBtn.className = 'btn-outline';
      endBtn.textContent = '台帳を閉じ、九人の最終結末を見届ける';
      endBtn.onclick = () => showGrandEnding();
      chEl.appendChild(endBtn);
    }
    // 10話（モモ）終了時：嘘偽りない真実エンドへ
    else if (sc.ep === 10) {
      const truthEndBtn = document.createElement('button');
      truthEndBtn.className = 'btn-secret';
      truthEndBtn.textContent = '百番目の記録を刻み、真実の結末を見届ける';
      truthEndBtn.onclick = () => showGrandEnding('G7');
      chEl.appendChild(truthEndBtn);
    }

    saveState();
    window.scrollTo(0, 0);
    return;
  }

  // 通常シーン
  stampEl.classList.add('hidden');
  sc.c.forEach(([label, nextTarget, effects, customClass]) => {
    const btn = document.createElement('button');
    btn.className = customClass || 'btn-outline';
    btn.textContent = label;
    btn.onclick = () => {
      if (effects) {
        for (const k in effects) {
          if (k === 'decay') state.decay += effects[k];
          else state.vars[k] = (state.vars[k] || 0) + effects[k];
        }
      }
      state._initedNode = false;
      if (typeof nextTarget === 'function') {
        const res = nextTarget(state.vars);
        if (typeof res === 'string') go(res);
      } else {
        go(nextTarget);
      }
    };
    chEl.appendChild(btn);
  });

  saveState();
  window.scrollTo(0, 0);
}

function showGrandEnding(forcedId = null) {
  state.node = 'GRAND_END';
  if (forcedId) state.forcedGrand = forcedId;
  const r = state.results;

  let grand;
  if (state.forcedGrand) {
    grand = GRAND_ENDS.find(g => g.id === state.forcedGrand);
  } else if (r.length === 10) {
    grand = GRAND_ENDS.find(g => g.id === 'G7');
  } else {
    grand = GRAND_ENDS.filter(g => !g.secret).find(g => g.check(r)) || GRAND_ENDS[5];
  }

  if (!archive.grand.includes(grand.id)) {
    archive.grand.push(grand.id);
    saveArchive();
  }

  updateVisuals();
  renderHeader(`最終記録 ─ ${grand.roman}`);
  $('echo').classList.add('hidden');

  const usedEpisodes = EPISODES.slice(0, r.length);
  let summaryLines = usedEpisodes.map((ep, i) => `・第${ep.id}話 ${ep.name}（${ep.no}）：${END_CAT[r[i]]}`);
  if (grand.id === 'G8') {
    summaryLines.push('・第10話 モモ（100番）：【記録抹消・処分】');
  }
  const summary = summaryLines.join('\n');
  const grandBody = typeof grand.text === 'function' ? grand.text(r) : grand.text;

  $('txt').textContent = `【聖園の最終台帳】\n${summary}\n\n────────────────\n\n${grandBody}`;

  const stampEl = $('stamp');
  stampEl.classList.remove('hidden', 'bad', 'truth');
  if (grand.id === 'G7') stampEl.classList.add('truth');
  else if (grand.id === 'G4' || grand.id === 'G5' || grand.id === 'G8') stampEl.classList.add('bad');

  const recordStr = grand.id === 'G8'
    ? `${r.map(x => ROMAN[x]).join(' - ')} - ×`
    : r.map(x => ROMAN[x]).join(' - ');

  stampEl.innerHTML = `
    <span class="stamp-num">${grand.roman}（記録：${recordStr}）</span>
    <span class="stamp-title">『${grand.title}』</span>
  `;

  const chEl = $('ch');
  chEl.innerHTML = '';
  const rstBtn = document.createElement('button');
  rstBtn.className = grand.id === 'G8' ? 'btn-hell' : 'btn-outline';
  rstBtn.textContent = '新たな台帳を開く（最初から）';
  rstBtn.onclick = resetGame;
  chEl.appendChild(rstBtn);

  saveState();
  window.scrollTo(0, 0);
}

function renderArchiveModal() {
  const body = $('arc-body');
  const g1Unlocked = archive.grand.includes('G1');
  let html = '';

  // 大エンド一覧
  html += `<div class="archive-section"><h4>大終幕（到達：${archive.grand.length} / ${GRAND_ENDS.length}）</h4><div class="archive-grid">`;
  GRAND_ENDS.forEach(g => {
    const ok = archive.grand.includes(g.id);
    let labelRight = ok ? `『${g.title}』` : '？？？';
    if (!ok && (g.id === 'G7' || g.id === 'G8')) {
      labelRight = g1Unlocked ? '条件解放済（第10話の選択で到達）' : '大終幕Ⅰ達成で解放';
    }
    html += `<div class="archive-item ${ok ? 'unlocked' : 'locked'}">
      <span>${g.roman}</span>
      <span>${labelRight}</span>
    </div>`;
  });
  html += `</div></div>`;

  // 各話小エンド一覧
  EPISODES.forEach(ep => {
    if (ep.secret && !g1Unlocked && !archive.small.some(k => k.startsWith('10_')) && !archive.grand.includes('G8')) {
      html += `<div class="archive-section"><h4>第10話：？？？</h4><div class="archive-grid">
        <div class="archive-item locked"><span>封印された記録</span><span>大終幕Ⅰ『完璧なる祝福の食卓』達成で解放</span></div>
      </div></div>`;
      return;
    }
    const count = [1,2,3,4,5].filter(i => archive.small.includes(`${ep.id}_${i}`)).length;
    html += `<div class="archive-section"><h4>第${ep.id}話：${ep.name}（${ep.no}）（${count} / 5）</h4><div class="archive-grid">`;
    [1,2,3,4,5].forEach(i => {
      const key = `${ep.id}_${i}`;
      const ok = archive.small.includes(key);
      const endObj = SC[`ep${ep.id}_e${i}`];
      html += `<div class="archive-item ${ok ? 'unlocked' : 'locked'}">
        <span>${END_CAT[i]}</span>
        <span>${ok ? `『${endObj.title}』` : '未観測'}</span>
      </div>`;
    });
    html += `</div></div>`;
  });

  body.innerHTML = html;
  $('arc-modal').classList.remove('hidden');
}

function resetGame() {
  state = {
    epIdx: 0,
    node: 'ep1_s1',
    results: [],
    vars: { faith: 0, doubt: 0, fear: 0, trust: 0 },
    decay: 0,
    forcedGrand: null,
    _initedNode: false
  };
  saveState();
  go('ep1_s1');
}

window.addEventListener('DOMContentLoaded', () => {
  loadArchive();
  if (loadState()) {
    if (state.node === 'GRAND_END' && state.results.length >= 9) {
      showGrandEnding();
    } else {
      go(state.node);
    }
  } else {
    resetGame();
  }

  $('rst').onclick = resetGame;
  $('btn-arc').onclick = renderArchiveModal;
  $('arc-close').onclick = () => $('arc-modal').classList.add('hidden');
  $('arc-modal').onclick = (e) => {
    if (e.target === $('arc-modal')) $('arc-modal').classList.add('hidden');
  };
});
</script>
</body>
