<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>祝福の食卓</title>
<style>
  :root {
    --bg-main: #12100e;
    --bg-card: #1b1815;
    --bg-sub: #25201b;
    --text-main: #e2d8c8;
    --text-muted: #968977;
    --accent-gold: #c29b57;
    --accent-green: #587856;
    --accent-blue: #52738a;
    --accent-danger: #9e2a2b;
    --border-color: #3d342b;
    --border-highlight: #5e4f3e;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.65);
    --vignette: inset 0 0 40px rgba(0, 0, 0, 0.6);
  }

  /* 摩耗度による画面の深淵化 */
  body.decay-1 {
    --bg-main: #100d0c;
    --bg-card: #181412;
    --vignette: inset 0 0 65px rgba(40, 5, 5, 0.65);
  }
  body.decay-2 {
    --bg-main: #0d0909;
    --bg-card: #161010;
    --border-color: #4a2828;
    --accent-gold: #a67641;
    --vignette: inset 0 0 90px rgba(75, 8, 8, 0.75);
  }
  body.decay-3 {
    --bg-main: #090505;
    --bg-card: #120b0b;
    --bg-sub: #1c1111;
    --border-color: #5c2323;
    --text-main: #d6c5c5;
    --accent-gold: #8c4a32;
    --vignette: inset 0 0 120px rgba(110, 10, 10, 0.85);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100dvh;
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
    transition: background-color 1.2s ease, box-shadow 1.2s ease;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    box-shadow: var(--vignette);
    z-index: 900;
  }

  /* コンテナ */
  #app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 12px;
    padding-bottom: env(safe-area-inset-bottom, 16px);
    position: relative;
    z-index: 1;
  }

  /* ヘッダー（重厚な台帳風） */
  header {
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    outline: 1px solid var(--border-color);
    outline-offset: -4px;
    border-radius: 4px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
  }

  .day-badge {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent-gold);
    letter-spacing: 0.08em;
  }

  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .stat-pill {
    background: var(--bg-sub);
    border: 1px solid var(--border-color);
    padding: 3px 8px;
    border-radius: 2px;
    font-weight: 600;
    color: var(--text-main);
  }

  /* アクションボタン群（全体コマンド） */
  .global-actions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  button {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    border: 1px solid var(--border-highlight);
    border-radius: 3px;
    padding: 10px 12px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, background-color 0.2s, border-color 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    touch-action: manipulation;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  }

  button:active:not(:disabled) {
    transform: scale(0.98);
  }

  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-primary {
    background: linear-gradient(180deg, #5c4526, #3d2c16);
    color: #f2e6d0;
    border-color: var(--accent-gold);
  }
  .btn-green {
    background: linear-gradient(180deg, #354a34, #223021);
    color: #dce8db;
    border-color: var(--accent-green);
  }
  .btn-blue {
    background: linear-gradient(180deg, #2e4352, #1d2b36);
    color: #d8e6f0;
    border-color: var(--accent-blue);
  }
  .btn-danger {
    background: linear-gradient(180deg, #6b1d1e, #421011);
    color: #f7dada;
    border-color: #b83b3b;
  }
  .btn-outline {
    background: var(--bg-sub);
    color: var(--text-main);
    border-color: var(--border-color);
  }
  .btn-outline:hover:not(:disabled) {
    border-color: var(--accent-gold);
  }

  /* 園児カード一覧 */
  .children-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }

  .child-card {
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    border-radius: 4px;
    padding: 12px;
    box-shadow: var(--shadow);
    position: relative;
  }

  .child-card::before {
    content: "";
    position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border: 1px solid rgba(194, 155, 87, 0.12);
    pointer-events: none;
  }

  .child-card.heretic {
    border: 1px solid #b83b3b;
    background: linear-gradient(180deg, #241111, #170b0b);
    box-shadow: 0 0 15px rgba(158, 42, 43, 0.35);
  }

  .child-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
    gap: 8px;
  }

  .child-name-area {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }

  .child-name {
    font-weight: 700;
    font-size: 1.08rem;
    color: var(--accent-gold);
    letter-spacing: 0.06em;
  }

  .child-card.heretic .child-name {
    color: #e05a5a;
  }

  .trait-badge {
    font-size: 0.75rem;
    padding: 2px 7px;
    border-radius: 2px;
    background: var(--bg-sub);
    border: 1px solid var(--border-color);
    color: var(--text-muted);
  }

  .heretic-badge {
    font-size: 0.75rem;
    padding: 2px 7px;
    border-radius: 2px;
    background: #6b1414;
    border: 1px solid #d94848;
    color: #ffdede;
    font-weight: 700;
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }

  /* ゲージ類 */
  .bars {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
    margin-bottom: 10px;
  }

  .bar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
  }

  .bar-label {
    width: 72px;
    flex-shrink: 0;
    color: var(--text-muted);
    font-weight: 600;
  }

  .bar-track {
    flex: 1;
    height: 7px;
    background: #0c0a09;
    border: 1px solid var(--border-color);
    border-radius: 1px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    transition: width 0.35s ease;
  }

  .fill-growth { background: linear-gradient(90deg, #8c662e, #c29b57); }
  .fill-faith { background: linear-gradient(90deg, #345269, #5c87a6); }
  .fill-fear { background: linear-gradient(90deg, #6e191a, #b83234); }

  .bar-val {
    width: 38px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--text-main);
  }

  /* セリフ・日記枠 */
  .child-quote {
    background: rgba(12, 10, 9, 0.65);
    border-left: 2px solid var(--accent-gold);
    padding: 8px 10px;
    font-size: 0.85rem;
    margin-bottom: 10px;
    color: var(--text-main);
    word-break: break-word;
  }

  .child-card.heretic .child-quote {
    background: rgba(50, 10, 10, 0.7);
    border-left-color: #d94848;
    color: #f5c6c6;
    font-weight: 600;
  }

  /* 個別コマンドボタン */
  .child-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    position: relative;
    z-index: 2;
  }

  .child-actions button {
    padding: 8px 2px;
    font-size: 0.78rem;
    flex-direction: column;
    gap: 2px;
    white-space: nowrap;
  }

  .child-actions button small {
    font-size: 0.62rem;
    color: var(--text-muted);
    letter-spacing: 0;
  }

  .ship-btn {
    grid-column: 1 / -1;
    background: linear-gradient(180deg, #6e4e23, #453013);
    border-color: #d4af37;
    color: #fff3d6;
    font-size: 0.92rem !important;
    padding: 10px !important;
    margin-bottom: 2px;
    letter-spacing: 0.08em;
  }

  /* ログエリア */
  .log-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-highlight);
    border-radius: 4px;
    padding: 10px 12px;
    margin-top: auto;
    max-height: 185px;
    overflow-y: auto;
    font-size: 0.82rem;
    box-shadow: var(--shadow);
  }

  .log-title {
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--accent-gold);
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
  }

  .log-entry {
    padding: 5px 0;
    border-bottom: 1px solid rgba(61, 52, 43, 0.5);
    word-break: break-word;
    color: var(--text-muted);
  }
  .log-entry:first-child { color: var(--text-main); }
  .log-entry:last-child { border-bottom: none; }
  .log-danger { color: #d9534f !important; font-weight: 600; }
  .log-good { color: #8ab886 !important; }

  /* モーダル（イベント・2択・エンディング） */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 4, 3, 0.88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
    backdrop-filter: blur(3px);
  }

  .modal-box {
    background: var(--bg-card);
    color: var(--text-main);
    width: 100%;
    max-width: 500px;
    max-height: 88dvh;
    overflow-y: auto;
    border-radius: 4px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9);
    border: 1px solid var(--accent-gold);
    outline: 1px solid var(--border-color);
    outline-offset: -5px;
  }

  .modal-box.ending-blood {
    background: #140606;
    color: #ebd5d5;
    border-color: #9e2a2b;
  }

  .modal-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--accent-gold);
    letter-spacing: 0.06em;
    margin: 0 0 14px 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-highlight);
  }

  .modal-box.ending-blood .modal-title {
    border-bottom-color: #6b1d1e;
    color: #e05252;
  }

  .modal-body {
    font-size: 0.94rem;
    margin-bottom: 18px;
    white-space: pre-line;
    word-break: break-word;
    line-height: 1.65;
  }

  .modal-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .modal-choices button {
    width: 100%;
    text-align: left;
    justify-content: flex-start;
    padding: 12px 14px;
    line-height: 1.45;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
 <header><div class="header-top"><div class="day-badge" id="day"></div><button class="btn-outline" id="rst" style="padding:4px 9px;font-size:0.75rem;">最初から</button></div>
 <div class="stats-row"><span class="stat-pill" id="st"></span></div></header>
 <div class="child-card"><div id="txt" style="white-space:pre-line;line-height:2;margin:6px 0 16px;font-size:1rem"></div><div class="modal-choices" id="ch"></div></div>
</div>
<script>
// 強制的にセーブデータを無効化し、クリーンな初期状態を確保する
const KEY='seien_nov6_stable', EK='seien_end_stable';

const SC={
d1:{D:1,l:'1日目　出会い',t:`七番目の子が来た。

c:[['頭を撫でて「いい子だね」と微笑む','d2',{b:1,f:1,k:1}],['「今日からここが家だ。規則を覚えなさい」と告げる','d2',{d:1}]]},
d2:{D:1,l:'2日目　勉強とごはん',t:`朝。六人の先輩に囲まれて、ナナは白いテーブルについた。

c:[['「君たちは、人に幸せを届ける天使なんだ」と教える','d2a',{f:2,k:1}],['まず警戒心を解くために、他の子と話をさせる','d2b',{b:1}]]},

「大丈夫、卒業の日に生えるんだよ！」`,c:[['夜になった','d3',{}]]},
d2b:{l:'2日目　先輩の言葉',t:`ナナはフタバの隣に座らされた。
『ここ、ごはんおいしいよ。いっぱい食べたらね、おいしくなって、食べてもらえるんだ！』

スプーンが皿に落ちて、澄んだ音を立てた。
『……たべて、もらえる？』

灰色の目が、はじめてあなたを見た。`,
c:[['「名誉なことなんだよ」と微笑んで教える','d3',{f:1,d:1,k:2}],['「フタバは冗談が好きでね」と笑って流す','d3',{d:2,k:1}],['何も言わず、ナナが自分で考えるのを待つ','d3',{d:1}]]},
d3:{D:1,l:'3日目　夜',t:`夜更け。廊下の端で、ナナが膝を抱えていた。

『……お母さんの顔、おぼえてないの』

そう言って少女は、手首の札をいじった。`,
c:[['「お母さんは天国で、君の卒業を待っているよ」','d4',{f:3,k:3}],['黙って隣に座り、毛布をかける','d4',{b:2}],['「早く寝なさい。明日も早い」','d4',{d:1}]]},
d4:{D:1,l:'5日目　フタバの卒業',t:`フタバの卒業の日が来た。
白い晴れ着のフタバは、満面の笑みでナナの手を握った。

『ナナ、先に行って待ってるね！ 天国で会おう！』

c:[['ナナを抱き上げ、笑って手を振らせる',v=>R(v),{f:1,k:2}],['「ちゃんと見送りなさい」と扉まで連れて行く',v=>R(v),{d:1,k:1}],['部屋に戻して、鍵をかける',v=>R(v),{d:2,b:-1}]]},
run:{D:1,l:'7日目　夜',t:`ナナがフタバの靴を抱えて、裏門の閂に手をかけている。

『……フタバは、天国に靴を忘れていったりしない』

灰色の目は、もう子供のものではなかった。`,
c:[['走って追いつき、腕をつかむ','e_caught',{k:3}],['追わない。立ち尽くして見ている','e_free',{}]]},
bond:{D:1,l:'7日目　通達',t:`本部の通達が届いた。「ナナを出荷せよ」。

wish:{D:1,l:'6日目　約束',t:`ナナがスキップで廊下を歩いている。

c:[['「約束だよ」と微笑み、卒業を早める','e_perfect',{k:3}],['「まだ早い。もっと大きくならないとね」','e_wait',{k:2}]]},
ask:{D:1,l:'6日目　夕方',t:`ナナが静かに、あなたの部屋の扉の前に立っていた。

e_perfect:{e:'祝福の食卓',l:'終幕',t:`卒業の日、ナナは白い晴れ着で扉の前に立った。

e_silent:{x:'esc',e:'答えなかった夜',l:'終幕',t:`沈黙は、肯定より正確に伝わった。

e_caught:{e:'きれいな台帳',l:'終幕',t:`腕はあっけなく掴めた。

e_free:{x:'esc',e:'開いた門',l:'終幕',t:`門が軋んで、小さな背中が夜に消えた。

e_alone:{e:'ひとりで行く道',l:'終幕',t:`『……うん』
ナナは一人で扉をくぐった。

小さな手のひらには、まだあなたの体温が残っていたはずだ。`},

// --- ユイ（1番） ---
y1:{D:1,l:'ユイ（1番）',t:`ユイは聖園で一番古い子だ。「1」を名前にもらった、最初の一人。
出荷の年頃を過ぎても、卒業していない。

今日も彼女は、あなたの書類仕事を黙って手伝っている。
『台帳、整理しておきました。七人目の名前が、増えていましたね』`,
c:[['「助かるよ。君がいなければ回らない」と労う','y2',{yb:1,k:1}],['「余計なことは考えなくていい」と遮る','y2',{yd:1}]]},
y2:{D:1,l:'ユイ　夜',t:`夜、ユイが倉庫で、卒業していった子たちの名札を数えている。

『……私の名前は、一番小さい数字なんですね』

三番と五番の名札だけが、箱の底で小さく鳴った。`,
c:[['「それは君が、一番信頼されている証だ」',v=>Y3(v),{yb:1,k:1}],['「数字に意味はない」',v=>Y3(v),{yd:1}]]},
y_stay:{D:1,l:'ユイ　願い',t:`『お願いがあります』
ユイは背筋を伸ばした。
『私を職員にしてください。あの子たちを、笑って送る側に回りたいんです』

彼女の目に、迷いはなかった。`,
c:[['「歓迎しよう」と手を差し出す','e_yui_staff',{k:3}],['「君は子供のままでいなさい」と断る','e_yui_grad',{k:2}]]},
y_out:{D:1,l:'ユイ　告白',t:`『……私は、あなたのようには、なれません』
ユイは名札をそっと箱に戻した。
『でも、もう、笑えないんです』`,
c:[['「それでも、ここで生きなさい」','e_yui_stay',{k:2}],['「ならば、卒業させてあげよう」','e_yui_grad',{k:3}]]},
y_go:{D:1,l:'ユイ　門の前',t:`『ナナが、逃げたと聞きました』
ユイが鞄を抱えて立っていた。
『私も、行けますか』`,
c:[['「……行きなさい」と門を開ける','e_yui_free',{}],['「ならば、お前も連れ戻す」','e_yui_back',{k:3}]]},
e_yui_staff:{e:'同僚',l:'終幕',t:`ユイは翌日から、白い晴れ着ではなく、あなたと同じ灰色の上着を着た。
子供たちを送る日、彼女は誰より優しく笑う。

あなたの鏡が、もう一枚増えた。`},
e_yui_grad:{e:'最年長の卒業',l:'終幕',t:`ユイは自分で名札を外し、扉の前に立った。
『一番はじめの子が、一番最後ですね』

振り返らなかった。
台帳の「1」の欄に、あなたは初めて、線を引いた。`},
e_yui_stay:{e:'檻の中の先輩',l:'終幕',t:`ユイは今日も、あなたの書類を整理している。
二度と、笑顔を見せなかった。

それでも毎朝、子供たちには『おはよう』と言う。
その声が一番、あなたの胸に刺さる。`},
e_yui_free:{e:'二人目の背中',l:'終幕',t:`門が軋んで、大きな背中が夜に消えた。
先に行った小さな背中を、追いかけるように。

夜明けまで、あなたは門を閉めなかった。`},
e_yui_back:{e:'連れ戻した朝',l:'終幕',t:`ユイは抵抗しなかった。
朝の食堂で、彼女は何事もなかったように配膳をしている。

『私が、手伝いますね』
その手だけが、少し震えていた。`},

// --- フタバ（2番） ---
fu1:{D:1,l:'フタバ（2番）',t:`フタバは鏡の前で、完璧な笑顔を作る練習をしている。
彼女は真実を知りながら、後輩たちのために『幸福な天使』を演じる道を選んだ子だ。

『園長先生。この笑顔なら、ナナも信じてくれますか？』`,
c:[['「あの子の希望になる、最高の笑顔だ」','fu2',{ff:1,k:2}],['「……無理をして笑うな」','fu2',{fdk:1}]]},
fu2:{D:1,l:'フタバ　約束',t:`フタバの卒業が迫る。
『お願いがあります。私が出発するとき、ナナには馬車を見せないで』
『あの子には、きれいな天国だけを信じさせてあげたいの』`,
c:[['「約束しよう」と、共犯者の契りを結ぶ','e_fu_perfect',{k:2}],['「あの子もいつか知るべきだ」と突き放す','e_fu_broken',{k:1}]]},
e_fu_perfect:{e:'共犯者の笑顔',l:'終幕',t:`フタバの卒業の日。
彼女はナナに向かって、誰よりも美しく笑ってみせた。

『天国で会おうね！』
それは、あなたと彼女が作り上げた、最高に純粋で残酷な嘘だった。`},
e_fu_broken:{e:'剥がれた仮面',l:'終幕',t:`扉が開く直前、馬車の音を聞いたフタバの顔から笑顔が消えた。
『いや……死にたくない……！』

ナナが見ている前で、彼女は泣き叫びながら引きずられていった。
希望は、最も残酷な形で打ち砕かれた。`},

// --- ヨナ（4番） ---
yo1:{D:1,l:'ヨナ（4番）',t:`ヨナは暇さえあれば祈っている。
『神様、わたしを許してください。お肉を少し残しました』

盲目的な信仰。だが、その手は微かに震えている。`,
c:[['「神は従順な子を愛するよ」と頭を撫でる','yo2',{yof:1,k:1}],['「無理に食べなくてもいい」と声をかける','yo2',{yodk:1}]]},
yo2:{D:1,l:'ヨナ　怯え',t:`『夜、倉庫から、ばけものの泣き声がしました』
ヨナが怯えた声で言う。

それは出荷直前の子が発した、生の執着の音だ。`,
c:[['「外の悪魔が迷い込んだんだ。祈りなさい」','e_yo_martyr',{k:2}],['「覗いたら、君も食べられてしまうよ」と脅す','e_yo_fear',{yodk:1,k:1}]]},
e_yo_martyr:{e:'完璧な殉教者',l:'終幕',t:`ヨナはさらに熱心に祈るようになった。
出荷の日、彼女は『神様のお役に立てるのですね』と恍惚とした顔で馬車に乗った。

恐怖を麻痺させた対価として、本部は高い評価を下した。`},
e_yo_fear:{e:'震える祈り',l:'終幕',t:`ヨナの祈りから、言葉が消えた。
ただガタガタと震えながら、手を組むだけの機械になった。

怯えきった個体は肉が硬くなる。評価は最低だった。`},

// --- リク（6番） ---
r1:{D:1,l:'リク（6番）',t:`焼却炉の裏で、リクが何かを拾い上げた。
煤けた名札。『5』の数字が半分溶けている。

『……園長先生。天使って、燃えるの？』
彼の鋭い目が、あなたの嘘を探っている。`,
c:[['「天へ昇る光の跡だよ」と微笑む','r2',{rf:1,k:2}],['無言で名札を取り上げる','r2',{rdk:1,k:1}]]},
r2:{D:1,l:'リク　疑念',t:`夜。リクがあなたの執務室に忍び込んできた。
『馬車が来るのはいつも夜中だ。誰も見送れない』

『……本当は、どこに送ってるの？』`,
c:[['「汚れた世界から隠すためだ」と教義を説く',v=>v.rdk>0?'e_riku_truth':'e_riku_lie',{k:2}],['「知りすぎたね」と、明日の出荷リストに彼を書き込む','e_riku_silenced',{k:4}]]},
e_riku_lie:{e:'探偵の敗北',l:'終幕',t:`リクは少し納得したような顔をして、部屋を出て行った。
子供の浅い知恵では、大人の用意した完璧な嘘の網を抜け出せなかった。

数日後、彼は静かに馬車に乗った。`},
e_riku_truth:{e:'共有された絶望',l:'終幕',t:`『……やっぱり。僕たち、食べられるんだね』
リクは泣かなかった。ただ、絶望だけがその瞳に宿った。

翌日、彼の姿はなかった。自ら命を絶つことで、出荷を拒絶したのだ。
台帳には『不良品によるロス』とだけ記された。`},
e_riku_silenced:{e:'繰り上げ出荷',l:'終幕',t:`真実に近づきすぎた罰として、リクは誰にも知られず夜の馬車に乗せられた。
『嘘つき……！』

最後の叫びは、闇の中に消えた。
子供たちには「特別に早く天使になれた」と説明した。`},

// --- ココ（9番） ---
ko1:{D:1,l:'ココ（9番）',t:`一番新しく来たココは、夜になると泣き出す。
『おうちにかえりたい。おかあさんにあいたい』

他の子たちの信仰を揺るがす、危険なノイズだ。`,
c:[['「ここが君の新しいお家だよ」と抱きしめる','ko2',{kf:1,k:1}],['睡眠薬入りのミルクを飲ませる','ko2',{k:3}]]},
ko2:{D:1,l:'ココ　拒絶',t:`ココは食事を拒否するようになった。
『どろの味がする。食べたくない……』

このままでは体重が落ち、商品価値がなくなってしまう。`,
c:[['喉の奥まで、無理やりスプーンを押し込む','e_ko_fed',{k:4}],['放置する。欠陥品として処理するしかない','e_ko_starved',{kdk:2}]]},
e_ko_fed:{e:'詰め込まれた幸福',l:'終幕',t:`泣き叫ぶココの口に、毎食無理やり栄養を詰め込んだ。
やがて彼女は心を壊し、何も言わずに口を開けるだけの人形になった。

出荷の日、彼女はただ虚空を見つめていた。`},
e_ko_starved:{e:'餓死した天使',l:'終幕',t:`食事を拒み続けたココは、出荷の日を待たずに息を引き取った。
『……おかあ、さん』

やせ細った体は、とても食肉用には見えなかった。`},

// --- トウカ（10番） ---
to1:{D:1,l:'トウカ（10番）',t:`トウカが咳き込み、白いハンカチを赤く染めた。
『……園長先生、ごめんなさい。わたし、立派な天使にはなれないみたい』

生来の病。出荷基準を満たせない「不良在庫」だ。`,
c:[['「薬を飲めば治るよ」と、甘いビタミン剤を渡す','to2',{tf:1,k:2}],['「少し休みなさい」と毛布をかける','to2',{tdk:1}]]},
to2:{D:1,l:'トウカ　宣告',t:`本部の医師から通達があった。
『個体番号10は廃棄処分とせよ。感染の恐れあり』

トウカはベッドで、苦しそうに息をしている。`,
c:[['規則通り、生きたまま地下の焼却炉へ落とす','e_to_discard',{k:5}],['規定量を超える鎮痛剤を打ち、安らかに眠らせる','e_to_mercy',{k:1}]]},
e_to_discard:{e:'規定通りの廃棄',l:'終幕',t:`『やだ、熱い、熱いよぉ……！』
地下から響く叫び声を、あなたは表情を変えずに聞いていた。

感情を殺すことこそが、この仕事の唯一の生存戦略だ。
台帳の『10』の欄には、赤線が引かれた。`},
e_to_mercy:{e:'せめてもの慈悲',l:'終幕',t:`トウカは微かに微笑み、そのまま静かに息を引き取った。
『……ありがとう、えんちょうせんせい』

冷たくなった小さな手を握りながら、あなたは自分がまだ完全に狂いきっていないことを悟った。`}

}; // SC End

// ナナ分岐関数
function R(v){return v.d>=4?'run':v.b>=3?'bond':v.f>=5?'wish':'ask';}

// ユイ分岐関数
function Y3(v){return v.esc?'y_go':v.yb>=2?'y_stay':'y_out';}

const CH={
  nana:{n:'ナナ',no:7,dk:'d',from:1},
  yui:{n:'ユイ',no:1,dk:'yd',from:2},
  futaba:{n:'フタバ',no:2,dk:'fdk',from:1},
  yona:{n:'ヨナ',no:4,dk:'yodk',from:2},
  riku:{n:'リク',no:6,dk:'rdk',from:3},
  koko:{n:'ココ',no:9,dk:'kdk',from:5},
  touka:{n:'トウカ',no:10,dk:'tdk',from:6}
};

const $=id=>document.getElementById(id);
const END=Object.keys(SC).filter(k=>SC[k].e);
let v, cc, seen=[];

// 初期データセットアップ（堅牢な初期化）
const V0=()=>{
  return {
    f:0, d:0, b:0, k:0,
    yb:0, yd:0,
    fdk:0, ff:0,
    yodk:0, yof:0,
    rdk:0, rf:0,
    kdk:0, kf:0,
    tdk:0, tf:0,
    day:1, esc:0,
    at:{
      nana:'d1', yui:'y1', futaba:'fu1', yona:'yo1',
      riku:'r1', koko:'ko1', touka:'to1'
    },
    done:{}
  };
};

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({cc: cc, v: v}));
    localStorage.setItem(EK, JSON.stringify(seen));
  }catch(e){console.warn('Save failed', e);}
}

function load(){
  try{
    seen = JSON.parse(localStorage.getItem(EK) || '[]');
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && r.v && r.v.at && r.v.at.touka) {
      v = r.v;
      cc = r.cc;
      return true;
    }
  }catch(e){console.warn('Load failed', e);}
  return false;
}

function show(l,t,btns){
  document.body.classList.remove('decay-1','decay-2','decay-3');
  if(v.k>=25) document.body.classList.add('decay-3');
  else if(v.k>=15) document.body.classList.add('decay-2');
  else if(v.k>=8) document.body.classList.add('decay-1');

  $('day').textContent=l;
  $('st').textContent=`第${v.day}日　嘘・加害: ${v.k}　到達した終幕: ${seen.length}/${END.length}`;
  $('txt').textContent=t;
  
  const ch=$('ch');
  ch.innerHTML='';
  btns.forEach(([x,f])=>{
    const b=document.createElement('button');
    b.className='btn-outline';
    b.textContent=x;
    b.onclick=f;
    ch.appendChild(b);
  });
  save();
  window.scrollTo(0,0);
}

function hub(){
  const act=Object.keys(CH).filter(c=>!v.done[c] && CH[c].from<=v.day);
  if(v.day>20 || !act.length) return fin();
  
  show('聖園',`第${v.day}日。\n今日は、誰のそばにいよう。\n\n（選ばれなかった子は、その間、あなたを見ている。）`,
    act.map(c=>[`${CH[c].n}（${CH[c].no}番）のそばにいる`, ()=>{cc=c; go(v.at[c]);}])
  );
}

function nav(n){
  if(SC[n].D){
    v.at[cc]=n;
    v.day++;
    Object.keys(CH).forEach(c=>{
      if(c!==cc && !v.done[c] && CH[c].from<v.day){
        v[CH[c].dk] = (v[CH[c].dk] || 0) + 1; // Undefined防止
      }
    });
    return hub();
  }
  go(n);
}

function go(id){
  const s=SC[id];
  if(!s) {
    console.error('Scenario not found:', id);
    return reset(); // 未定義IDに飛んだ場合の安全装置
  }

  const t = typeof s.t==='function' ? s.t(v) : s.t;
  
  if(s.e){
    if(!seen.includes(id)) {
      seen.push(id);
    }
    v.done[cc]=id;
    if(s.x) v[s.x]=1;
    return show('終幕', t+`\n\n──　終幕『${s.e}』　──`, [['日常に戻る', ()=>{v.day++; hub();}]]);
  }
  
  show(s.l, t, s.c.map(([x,n,e])=>[x, ()=>{
    for(const k in e) { v[k] = (v[k] || 0) + e[k]; }
    const nextId = typeof n==='function' ? n(v) : n;
    nav(nextId);
  }]));
}

function fin(){
  const nm = Object.keys(v.done).map(c=>`・${CH[c].n}（${CH[c].no}番）　『${SC[v.done[c]].e}』`).join('\n');
  const allDone = Object.keys(CH).every(c=>v.done[c]);
  
  let msg = `聖園の台帳が閉じられる。\n\n${nm||'（誰も、見送れなかった）'}\n\nあなたは${v.k}回、嘘をついた。`;
  
  let btns = [['最初から', reset]];

  if(allDone){
    msg += `\n\nそれから数年が過ぎた。\n三十番目の子が、門をくぐってきた。`;
    btns = [['三十番目の子を迎える', ()=>{
      show('数年後　三十番目', `あなたは少女の前にしゃがんだ。\n\n「よろしくね。君の名前はミオ。かわいいでしょう？」\n\n『……ミオ。』\n\n少女は、ナナと同じ声で、名前を繰り返した。\n台帳の数字は、また一つ増えた。\n\n（完）`, [['最初から', reset]]);
    }]];
  }
  
  show('二十日の終わり', msg, btns);
}

function reset(){
  v = V0();
  cc = 'nana';
  save();
  go('d1');
}

window.addEventListener('DOMContentLoaded', ()=>{
  if(load()) {
    hub();
  } else {
    reset();
  }
  $('rst').onclick = reset;
});
</script>
</body>
</html>
